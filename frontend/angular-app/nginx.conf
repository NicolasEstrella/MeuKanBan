server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Config de runtime nunca cacheada
    location /assets/config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Fallback SPA para o Angular Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
